<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أساسيات تخطيط المشروع | عرض تفاعلي</title>
<!-- خط عربي واضح (إن لم يتوفر الإنترنت سيُستخدم خط النظام تلقائيًا) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<style>
/* =========================================================
   1) الألوان والهوية البصرية — غيّري الألوان من هنا
   ========================================================= */
:root{
  --p:#6C3FD1;      /* البنفسجي الأساسي */
  --p2:#8B5CF6;     /* بنفسجي فاتح */
  --pd:#46238F;     /* بنفسجي غامق */
  --pl:#EFE8FF;     /* خلفية بنفسجية ناعمة */
  --pl2:#F8F5FF;
  --ac:#14B8A6;     /* اللون المساعد (فيروزي) */
  --acd:#0E8C7F;
  --am:#F59E0B;     /* لمسة ذهبية */
  --pink:#EC4899;
  --ok:#10B981;
  --bad:#F43F5E;
  --ink:#2A1B4D;    /* لون النص */
  --mut:#6B5E8A;
  --line:#E6DDFF;
}

/* =========================================================
   2) أساسيات الصفحة — منع التمرير وتثبيت نسبة 16:9
   ========================================================= */
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#E7E0F8;font-family:'Cairo',Tahoma,'Segoe UI',sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none}
input{user-select:text;-webkit-user-select:text}
button{font-family:inherit;cursor:pointer}
b{color:var(--p);font-weight:900}

/* المسرح: 1600×900 ويتم تكبيره/تصغيره بالجافاسكربت ليملأ الشاشة */
#stage{
  position:absolute;left:50%;top:50%;width:1600px;height:900px;
  transform-origin:center center;overflow:hidden;overflow:clip;
  background:linear-gradient(140deg,#FDFBFF 0%,#F4EEFF 60%,#EEF9F7 100%);
}
/* زخارف خلفية ناعمة */
#stage::before,#stage::after{content:"";position:absolute;border-radius:50%;pointer-events:none;z-index:0}
#stage::before{width:620px;height:620px;left:-220px;top:-260px;background:radial-gradient(circle,rgba(139,92,246,.16),transparent 70%)}
#stage::after{width:560px;height:560px;right:-200px;bottom:-240px;background:radial-gradient(circle,rgba(20,184,166,.14),transparent 70%)}

/* =========================================================
   3) الشرائح وحركات الانتقال
   ========================================================= */
.slide{position:absolute;inset:0;overflow:hidden;overflow:clip;padding:48px 88px 70px;display:flex;flex-direction:column;opacity:0;visibility:hidden;z-index:1}
.slide.active{opacity:1;visibility:visible;z-index:2}
.slide.active[data-anim="fade"]{animation:inFade .7s ease both}
.slide.active[data-anim="zoom"]{animation:inZoom .7s cubic-bezier(.2,.8,.2,1) both}
.slide.active[data-anim="slide"][data-dir="next"]{animation:inNext .7s cubic-bezier(.2,.8,.2,1) both}
.slide.active[data-anim="slide"][data-dir="prev"]{animation:inPrev .7s cubic-bezier(.2,.8,.2,1) both}
.slide.leaving{visibility:visible;opacity:1;animation:out .45s ease forwards;z-index:1}
@keyframes inFade{from{opacity:0}to{opacity:1}}
@keyframes inZoom{from{opacity:0;transform:scale(.93)}to{opacity:1;transform:none}}
@keyframes inNext{from{opacity:0;transform:translateX(-90px)}to{opacity:1;transform:none}}
@keyframes inPrev{from{opacity:0;transform:translateX(90px)}to{opacity:1;transform:none}}
@keyframes out{to{opacity:0;transform:scale(.97)}}

/* ظهور العناصر بالتتابع */
.slide.active .rv{animation:rise .6s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0) * 90ms + 180ms)}
@keyframes rise{from{opacity:0;transform:translateY(26px)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
@keyframes wave{0%,100%{transform:rotate(0)}25%{transform:rotate(18deg)}75%{transform:rotate(-12deg)}}
.shake{animation:shake .45s ease !important}
.float{display:inline-block;animation:floaty 3.2s ease-in-out infinite}

/* =========================================================
   4) عناصر مشتركة
   ========================================================= */
.shead{display:flex;align-items:center;gap:22px;margin-bottom:26px;flex-wrap:wrap}
.tag{background:#fff;color:var(--p);font-weight:800;font-size:23px;padding:7px 22px;border-radius:999px;border:2px solid var(--line);box-shadow:0 4px 14px rgba(108,63,209,.08);white-space:nowrap}
.stitle{font-size:54px;font-weight:900;margin:0;line-height:1.3;color:var(--ink)}
.body{flex:1;min-height:0;display:flex;flex-direction:column;gap:22px}
.lead{font-size:30px;line-height:1.7;margin:0;color:var(--ink)}
.muted{color:var(--mut)}
.center{text-align:center}
.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.row.c{justify-content:center}

.card{background:#fff;border-radius:28px;border:2px solid #EEE7FF;box-shadow:0 14px 36px rgba(76,40,160,.09)}

.btn{font-size:25px;font-weight:800;border:none;border-radius:18px;padding:12px 30px;background:var(--p);color:#fff;
  box-shadow:0 7px 0 var(--pd);transition:transform .15s, box-shadow .15s, filter .2s}
.btn:hover{transform:translateY(-3px);filter:brightness(1.08)}
.btn:active{transform:translateY(5px);box-shadow:0 2px 0 var(--pd)}
.btn.ghost{background:#fff;color:var(--p);border:2px solid var(--line);box-shadow:0 6px 0 #DCCFFF}
.btn.teal{background:var(--ac);box-shadow:0 7px 0 var(--acd)}
.btn.sm{font-size:21px;padding:8px 20px;border-radius:14px}

.hidden-step{opacity:0;transform:translateY(20px) scale(.97);transition:all .5s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.hidden-step.show{opacity:1;transform:none;pointer-events:auto}

.note{background:linear-gradient(90deg,#FFF7E6,#FFFBF2);border:2px dashed #F6C977;border-radius:20px;padding:14px 26px;font-size:26px;font-weight:700;color:#7A4C00}
.chip{background:var(--pl);color:var(--pd);border-radius:999px;padding:8px 22px;font-size:24px;font-weight:800;border:2px solid var(--line)}

.feedback{min-height:64px;font-size:32px;font-weight:900;text-align:center;display:flex;align-items:center;justify-content:center}
.feedback .ok{color:var(--ok);animation:pop .5s both}
.feedback .no{color:var(--p);animation:pop .5s both}

/* =========================================================
   5) شريط التحكم + المؤشرات (داخل المسرح فلا يغطي المحتوى)
   ========================================================= */
#progress{position:absolute;top:0;right:0;height:7px;background:linear-gradient(90deg,var(--ac),var(--p2),var(--p));z-index:40;transition:width .5s ease;border-radius:0 0 0 8px}
#bar{position:absolute;bottom:10px;left:14px;display:flex;align-items:center;gap:4px;
  background:rgba(42,27,77,.72);padding:4px 6px;border-radius:999px;z-index:40;
  box-shadow:0 4px 12px rgba(42,27,77,.18);transition:opacity .35s, transform .35s}
#bar button{border:none;background:transparent;color:#fff;font-size:15px;font-weight:800;height:30px;padding:0 10px;border-radius:999px;transition:background .2s}
#bar button:hover{background:rgba(255,255,255,.2)}
#bar button:active{transform:scale(.92)}
#bar .clap{font-size:17px;padding:0 8px}
#bar .count{color:#fff;font-size:14px;font-weight:800;min-width:54px;text-align:center}
#bar .sep{width:1px;height:18px;background:rgba(255,255,255,.25)}
#hint{position:absolute;bottom:14px;right:16px;z-index:40;font-size:13px;font-weight:700;color:var(--mut);background:rgba(255,255,255,.75);
  border:1px solid var(--line);padding:3px 12px;border-radius:999px;transition:opacity .35s}
body.idle #bar{opacity:0;transform:translateY(20px);pointer-events:none}
body.idle #hint{opacity:0}
body.idle{cursor:none}

/* طبقة المؤثرات (تصفيق/احتفال) */
#fx{position:absolute;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.clapfx{position:absolute;font-size:46px;animation:clapUp 1.8s ease-out forwards}
@keyframes clapUp{0%{opacity:0;transform:translate(0,0) scale(.5)}15%{opacity:1;transform:translate(calc(var(--dx)*.2),-60px) scale(1.1)}100%{opacity:0;transform:translate(var(--dx),-520px) scale(.8) rotate(var(--r))}}
.conf{position:absolute;width:14px;height:20px;border-radius:4px;animation:burst 1.3s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes burst{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r))}}
.bigmsg{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-size:64px;font-weight:900;color:var(--p);background:#fff;
  padding:24px 50px;border-radius:32px;box-shadow:0 20px 60px rgba(76,40,160,.25);animation:bigmsg 1.6s ease forwards;white-space:nowrap}
@keyframes bigmsg{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%)}}

/* =========================================================
   6) تصميم أنواع الشرائح
   ========================================================= */

/* --- التحضير --- */
.prep{display:flex;justify-content:center;flex:1;min-height:0;align-items:center}
.prep-hero{text-align:center;padding:40px 90px;min-width:900px}
.prep-hero .wave{font-size:120px;display:inline-block;animation:wave 2s ease-in-out infinite;transform-origin:70% 80%}
.prep-hero h1{font-size:66px;font-weight:900;margin:10px 0 6px;color:var(--pd)}
.prep-hero p{font-size:32px;margin:0 0 20px;color:var(--mut);font-weight:700}
.date{display:inline-flex;flex-direction:column;gap:4px;background:var(--pl);border-radius:20px;padding:14px 36px;font-size:32px;font-weight:800;color:var(--pd)}
.date small{font-size:26px;color:var(--mut);font-weight:700}
.prep-side h3{font-size:32px;margin:0 0 18px}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.check{display:flex;align-items:center;gap:16px;background:#fff;border:3px solid var(--line);border-radius:24px;padding:20px 22px;font-size:28px;font-weight:800;color:var(--ink);transition:all .25s;text-align:right}
.check:hover{transform:translateY(-4px);border-color:var(--p2)}
.check .ci{font-size:46px}
.check .box{margin-inline-start:auto;width:44px;height:44px;border-radius:14px;border:3px solid var(--line);display:grid;place-items:center;color:transparent;font-size:28px;transition:all .25s}
.check.on{border-color:var(--ok);background:#ECFDF5}
.check.on .box{background:var(--ok);border-color:var(--ok);color:#fff;animation:pop .4s}
.ready-msg{margin-top:20px;font-size:32px;font-weight:900;color:var(--ok);text-align:center}
.rules{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}

/* --- بطاقات القلب --- */
.flips{display:grid;grid-template-columns:repeat(4,1fr);gap:26px;flex:1;min-height:0;max-height:420px}
.flip{perspective:1400px;background:none;border:none;padding:0;height:100%}
.flip-in{position:relative;width:100%;height:100%;transition:transform .8s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.face.front{background:linear-gradient(160deg,#fff,var(--pl));border:3px solid var(--line);box-shadow:0 14px 34px rgba(76,40,160,.1)}
.face.front .ic{font-size:92px}
.face.front .ft{font-size:40px;font-weight:900;color:var(--pd);margin-top:10px}
.face.front .tap{font-size:20px;color:var(--mut);margin-top:10px;font-weight:700}
.face.back{transform:rotateY(180deg);background:linear-gradient(160deg,var(--p),var(--pd));color:#fff}
.face.back .bt{font-size:30px;font-weight:800;line-height:1.6}
.face.back .ex{font-size:22px;margin-top:16px;background:rgba(255,255,255,.16);padding:8px 16px;border-radius:14px;font-weight:700}
.bridge{font-size:36px;font-weight:800;text-align:center;padding:22px;background:linear-gradient(90deg,#ECFDF5,#F0EBFF);border-radius:24px;border:2px solid #CFF3EC}

/* --- ماذا تتوقعين --- */
.predict{display:grid;grid-template-columns:1fr 1fr;gap:40px;flex:1;min-height:0}
.scene{padding:36px 40px;display:flex;flex-direction:column;justify-content:center;gap:20px;background:linear-gradient(160deg,#fff,#FFF6EC)}
.scene .big{font-size:100px;text-align:center}
.scene p{font-size:32px;line-height:1.8;margin:0;font-weight:600}
.pred-list{display:flex;flex-direction:column;gap:16px}
.pred-q{font-size:40px;font-weight:900;color:var(--pd);margin:0 0 6px}
.pred-item{display:flex;align-items:center;gap:18px;background:#fff;border:2px solid var(--line);border-radius:22px;padding:14px 22px;font-size:30px;font-weight:800}
.pred-item span{font-size:42px}

/* --- العنوان --- */
.titleS{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative}
.titleS .kicker{font-size:30px;font-weight:800;color:var(--mut)}
.titleS .badge{background:var(--p);color:#fff;font-size:32px;font-weight:900;padding:8px 36px;border-radius:999px;margin:18px 0 8px;box-shadow:0 8px 0 var(--pd)}
.titleS h1{font-size:108px;font-weight:900;margin:8px 0;background:linear-gradient(90deg,var(--pd),var(--p2),var(--ac));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.35}
.titleS .sub{font-size:38px;font-weight:700;color:var(--ink)}
.orbit{position:absolute;font-size:64px;opacity:.9}
.titleS .tnote{margin-top:26px}

/* --- القائمة (الأهداف) --- */
.olist{display:grid;grid-template-columns:1fr 1fr;gap:20px 32px}
.oitem{display:flex;align-items:center;gap:20px;padding:20px 26px;font-size:31px;font-weight:800}
.oitem .n{flex:none;width:58px;height:58px;border-radius:18px;background:var(--pl);display:grid;place-items:center;font-size:34px}

/* --- المعادلة --- */
.eq{display:flex;align-items:center;justify-content:center;gap:22px;margin-top:10px}
.eq-op{font-size:70px;font-weight:900;color:var(--p2)}
.eq-box{width:250px;height:230px;border-radius:30px;border:3px dashed var(--p2);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;transition:all .3s;position:relative}
.eq-box:hover{transform:translateY(-6px)}
.eq-box .q{font-size:100px;font-weight:900;color:var(--p2)}
.eq-box .a{display:none;flex-direction:column;align-items:center;gap:8px}
.eq-box .a i{font-style:normal;font-size:74px}
.eq-box .a span{font-size:28px;font-weight:900;color:var(--pd)}
.eq-box.on{border-style:solid;border-color:var(--p);background:linear-gradient(160deg,#fff,var(--pl))}
.eq-box.on .q{display:none}
.eq-box.on .a{display:flex;animation:pop .5s}
.eq-box.res{border-color:var(--ac)}
.eq-box.res.on{border-color:var(--ac);background:linear-gradient(160deg,#fff,#E6FBF8)}
.defbox{padding:22px 34px;font-size:32px;line-height:1.7;font-weight:600;border-right:10px solid var(--p)}

/* --- التصنيف --- */
.sort-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.sitem{padding:16px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;transition:all .3s;position:relative}
.sitem .si{font-size:52px;line-height:1}
.sitem .st{font-size:27px;font-weight:800;min-height:44px;display:flex;align-items:center}
.sitem .sb{display:flex;gap:10px}
.sitem .sb button{border:2px solid var(--line);background:#fff;border-radius:14px;padding:6px 16px;font-size:22px;font-weight:800;color:var(--ink);transition:all .2s}
.sitem .sb button:hover{background:var(--pl);border-color:var(--p2)}
.sitem .sb button.x{background:#FFE4E8;border-color:var(--bad)}
.sitem .done{display:none;font-size:25px;font-weight:900;padding:6px 20px;border-radius:999px;color:#fff}
.sitem.ok .sb{display:none}
.sitem.ok .done{display:block;animation:pop .45s}
.sitem.ok.ca{border-color:var(--p);background:#F7F3FF}.sitem.ok.ca .done{background:var(--p)}
.sitem.ok.cb{border-color:var(--ac);background:#EEFBF9}.sitem.ok.cb .done{background:var(--ac)}
.score{font-size:26px;font-weight:900;background:#fff;border:2px solid var(--line);border-radius:999px;padding:6px 22px;color:var(--pd)}

/* --- البطاقات القابلة للنقر --- */
.cgrid{display:grid;gap:20px;flex:1;min-height:0}
.ccard{padding:18px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;transition:all .3s;border:2px solid #EEE7FF}
.ccard:hover{transform:translateY(-5px);border-color:var(--p2)}
.ccard .ci{font-size:58px;line-height:1.1;transition:transform .3s}
.ccard .ct{font-size:29px;font-weight:900;color:var(--pd)}
.ccard .cx{font-size:23px;font-weight:700;line-height:1.6;color:var(--ink);opacity:0;transform:translateY(10px);transition:all .4s}
.ccard .tap{font-size:18px;color:var(--mut);font-weight:700;transition:opacity .3s}
.ccard.open{background:linear-gradient(160deg,#fff,var(--pl));border-color:var(--p)}
.ccard.open .cx{opacity:1;transform:none}
.ccard.open .tap{opacity:0;height:0}
.chips{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* --- المثلث --- */
.tri{display:grid;grid-template-columns:640px 1fr;gap:40px;flex:1;min-height:0;align-items:center}
.tri-wrap{position:relative;width:620px;height:500px}
.tri-wrap svg{position:absolute;inset:0}
.tnode{position:absolute;width:170px;height:110px;border-radius:26px;border:3px solid var(--p);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:30px;font-weight:900;color:var(--pd);transition:all .25s;transform:translate(-50%,-50%);box-shadow:0 10px 26px rgba(76,40,160,.12)}
.tnode i{font-style:normal;font-size:42px}
.tnode:hover,.tnode.on{background:var(--p);color:#fff;transform:translate(-50%,-50%) scale(1.07)}
.tcenter{position:absolute;left:50%;top:62%;transform:translate(-50%,-50%);background:#E6FBF8;color:var(--acd);border-radius:999px;padding:10px 26px;font-size:26px;font-weight:900;border:2px solid #BDEFE8}
.tinfo{padding:26px 32px;min-height:170px;font-size:29px;line-height:1.7;font-weight:600}
.tinfo h3{margin:0 0 6px;font-size:34px;color:var(--p)}
.lab{padding:20px 28px;margin-top:20px}
.lab h4{margin:0 0 10px;font-size:27px}
.lab input[type=range]{width:100%;accent-color:var(--p);height:34px}
.barrow{display:grid;grid-template-columns:130px 1fr 150px;align-items:center;gap:14px;font-size:24px;font-weight:800;margin-top:8px}
.bartrack{height:26px;background:var(--pl);border-radius:999px;overflow:hidden}
.barfill{height:100%;border-radius:999px;transition:width .5s cubic-bezier(.2,.8,.2,1)}

/* --- فكر زاوج شارك --- */
.tps-q{padding:26px 34px;font-size:40px;font-weight:900;text-align:center;background:linear-gradient(135deg,#fff,var(--pl))}
.tps-row{display:grid;grid-template-columns:repeat(3,1fr) 300px;gap:20px;align-items:stretch}
.phase{padding:18px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:28px;font-weight:900;border:3px solid #EEE7FF;transition:all .3s}
.phase i{font-style:normal;font-size:56px}
.phase small{font-size:21px;color:var(--mut);font-weight:700}
.phase.on{border-color:var(--ac);background:#EEFBF9;transform:translateY(-6px)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.cmp .col{padding:18px 26px}
.cmp h4{margin:0 0 6px;font-size:30px;color:var(--p)}
.cmp ul{margin:0;padding-inline-start:28px;font-size:25px;font-weight:700;line-height:1.7}

/* --- المؤقت --- */
.timer{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px}
.tm-num{font-size:62px;font-weight:900;color:var(--pd);font-variant-numeric:tabular-nums;line-height:1}
.timer.done .tm-num{color:var(--bad);animation:shake .5s 2}
.timer .ringbox{position:relative;width:300px;height:300px}
.timer .ringbox svg{transform:rotate(-90deg)}
.timer .ringbox .tm-num{position:absolute;inset:0;display:grid;place-items:center;font-size:90px}
.timer circle.bg{stroke:var(--pl)}
.timer circle.fg{stroke:var(--p);transition:stroke-dashoffset 1s linear, stroke .3s}
.timer.warn circle.fg{stroke:var(--bad)}

/* --- الترتيب --- */
.slots{display:flex;align-items:stretch;justify-content:center;gap:8px}
.slot{width:250px;min-height:200px;border-radius:24px;border:3px dashed var(--line);background:rgba(255,255,255,.6);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:14px 12px;text-align:center;gap:6px}
.slot .sn{width:48px;height:48px;border-radius:50%;background:var(--pl);display:grid;place-items:center;font-size:26px;font-weight:900;color:var(--p)}
.slot.fill{border-style:solid;border-color:var(--p);background:#fff;animation:pop .45s}
.slot.fill .sn{background:var(--p);color:#fff}
.slot .sl{font-size:28px;font-weight:900;color:var(--pd)}
.slot .sd{font-size:20px;font-weight:700;color:var(--mut);line-height:1.5}
.arrow{align-self:center;font-size:40px;color:var(--p2);font-weight:900}
.pool{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.pool button{font-size:28px;font-weight:900;padding:14px 26px;border-radius:20px;border:3px solid var(--line);background:#fff;color:var(--ink);box-shadow:0 6px 0 #DCCFFF;transition:all .2s}
.pool button:hover{transform:translateY(-4px);border-color:var(--p2)}
.pool button.used{visibility:hidden}

/* --- اختيار من متعدد --- */
.mcq-q{padding:26px 36px;font-size:40px;font-weight:900;text-align:center;line-height:1.6;display:flex;align-items:center;justify-content:center;gap:24px}
.mcq-q .qi{font-size:76px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.opt{display:flex;align-items:center;gap:20px;padding:18px 26px;font-size:31px;font-weight:800;background:#fff;border:3px solid var(--line);border-radius:26px;color:var(--ink);text-align:right;transition:all .2s;box-shadow:0 6px 0 #E6DDFF}
.opt:hover{transform:translateY(-4px);border-color:var(--p2)}
.opt .oi{flex:none;width:62px;height:62px;border-radius:18px;background:var(--pl);display:grid;place-items:center;font-size:36px;font-weight:900;color:var(--p)}
.opt.right{background:#ECFDF5;border-color:var(--ok);box-shadow:0 6px 0 #A7F3D0}
.opt.right .oi{background:var(--ok);color:#fff}
.opt.wrong{background:#FFF1F4;border-color:#FDA4AF;opacity:.75}
.explain{font-size:27px;font-weight:700;text-align:center;color:var(--acd)}

/* --- صح وخطأ --- */
.tf-list{display:flex;flex-direction:column;gap:14px}
.tf{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;padding:14px 24px;transition:all .3s}
.tf .tt{font-size:28px;font-weight:800}
.tf .fix{display:block;font-size:22px;color:var(--acd);font-weight:700;margin-top:4px}
.tf .tb{display:flex;gap:12px}
.tf .tb button{width:120px;height:58px;border-radius:16px;border:3px solid var(--line);background:#fff;font-size:25px;font-weight:900;transition:all .2s}
.tf .tb button:hover{transform:translateY(-3px)}
.tf .tb .t{color:var(--ok)} .tf .tb .f{color:var(--bad)}
.tf.ok{border-color:var(--ok);background:#F2FDF8}
.tf .tb button.sel{background:var(--ok);color:#fff;border-color:var(--ok)}
.tf .tb button.x{background:#FFE4E8;border-color:var(--bad)}

/* --- العصف الذهني --- */
.storm{position:relative;flex:1;min-height:0}
.storm-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:420px;padding:26px;border-radius:40px;background:linear-gradient(135deg,var(--p),var(--pd));color:#fff;text-align:center;font-size:32px;font-weight:900;line-height:1.5;box-shadow:0 18px 40px rgba(76,40,160,.3);z-index:2}
.idea{position:absolute;transform:translate(-50%,-50%);background:#fff;border:3px solid var(--line);border-radius:26px;padding:10px 22px;font-size:25px;font-weight:800;max-width:390px;text-align:center;animation:ideaIn .5s cubic-bezier(.2,.8,.2,1) both;box-shadow:0 8px 20px rgba(76,40,160,.1);width:max-content;line-height:1.5}
.idea.book{border-color:var(--ac);background:#EEFBF9}
@keyframes ideaIn{from{opacity:0;transform:translate(-50%,-50%) scale(.3)}}
.storm-in{display:flex;gap:14px;align-items:center}
.storm-in input{flex:1;font-family:inherit;font-size:26px;font-weight:700;padding:12px 22px;border-radius:18px;border:3px solid var(--line);outline:none;color:var(--ink)}
.storm-in input:focus{border-color:var(--p2)}

/* --- المجموعات --- */
.groups{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.grp{padding:20px 18px;text-align:center;border-top:10px solid var(--c)}
.grp i{font-style:normal;font-size:54px;display:block}
.grp h4{margin:6px 0;font-size:29px;color:var(--c)}
.grp p{margin:0;font-size:24px;font-weight:700;line-height:1.6}
.gfoot{display:grid;grid-template-columns:1fr 380px;gap:24px;align-items:center}

/* --- بطاقة المشروع (تطبيق عملي) --- */
.builder{display:grid;grid-template-columns:1fr 1fr;gap:34px;flex:1;min-height:0}
.fields{display:flex;flex-direction:column;gap:12px}
.field{display:grid;grid-template-columns:230px 1fr;align-items:center;gap:14px;font-size:25px;font-weight:800}
.field input{font-family:inherit;font-size:24px;font-weight:700;padding:10px 18px;border-radius:16px;border:3px solid var(--line);outline:none;color:var(--ink);width:100%}
.field input:focus{border-color:var(--p2)}
.pcard{align-self:start;padding:24px 30px;display:flex;flex-direction:column;gap:14px;background:linear-gradient(160deg,#fff,var(--pl));border:3px solid var(--p2)}
.pcard h3{margin:0;font-size:38px;color:var(--pd);text-align:center}
.pstats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pstat{background:#fff;border-radius:20px;padding:12px;text-align:center;border:2px solid var(--line)}
.pstat i{font-style:normal;font-size:38px;display:block}
.pstat b{display:block;font-size:22px;color:var(--mut)}
.pstat span{font-size:23px;font-weight:800;word-break:break-word}
.pcard .stk{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:44px}
.pcard .stk .chip{font-size:21px;padding:5px 16px}
.pcard.approved{border-color:var(--ok);box-shadow:0 0 0 8px rgba(16,185,129,.15)}
.stamp{display:none;text-align:center;font-size:30px;font-weight:900;color:var(--ok)}
.pcard.approved .stamp{display:block;animation:pop .5s}

/* --- تحدي الدقيقة --- */
.chal{display:grid;grid-template-columns:380px 1fr;gap:40px;flex:1;min-height:0;align-items:center}
.chal-task{font-size:34px;font-weight:800;line-height:1.7;padding:24px 32px}
.counter{display:flex;align-items:center;gap:18px;justify-content:center;font-size:26px;font-weight:800}
.counter .cn{font-size:60px;font-weight:900;color:var(--p);min-width:90px;text-align:center}
.ans-grid{display:flex;flex-wrap:wrap;gap:12px}
.ans-grid .chip{font-size:25px}

/* --- المراجعة (خريطة ذهنية) --- */
.mind{display:grid;grid-template-columns:1fr 360px 1fr;gap:26px;flex:1;min-height:0;align-items:center}
.mcol{display:flex;flex-direction:column;gap:16px}
.mcore{width:320px;height:320px;border-radius:50%;margin:auto;background:linear-gradient(135deg,var(--p),var(--pd));color:#fff;display:grid;place-items:center;text-align:center;font-size:38px;font-weight:900;padding:40px;line-height:1.5;box-shadow:0 0 0 18px rgba(139,92,246,.15),0 20px 50px rgba(76,40,160,.3)}
.branch{padding:14px 22px;text-align:right;border:3px solid #EEE7FF;transition:all .3s;display:block;width:100%;background:#fff;border-radius:24px;font-family:inherit;color:var(--ink)}
.branch:hover{border-color:var(--p2)}
.branch .bh{font-size:29px;font-weight:900;color:var(--pd);display:flex;align-items:center;gap:12px}
.branch .bp{font-size:22px;font-weight:700;color:var(--mut);max-height:0;overflow:hidden;opacity:0;transition:all .4s;line-height:1.6}
.branch.open{border-color:var(--p);background:#FAF7FF}
.branch.open .bp{max-height:120px;opacity:1;margin-top:4px}

/* --- التقييم الفوري --- */
.exit{display:grid;grid-template-columns:1.2fr 1fr;gap:34px;flex:1;min-height:0}
.votes{display:flex;flex-direction:column;gap:18px;padding:24px 30px;justify-content:center}
.vote{display:grid;grid-template-columns:90px 230px 1fr 60px;align-items:center;gap:14px;background:none;border:none;padding:6px;border-radius:20px;text-align:right;color:var(--ink)}
.vote:hover{background:var(--pl2)}
.vote .ve{font-size:70px;transition:transform .2s}
.vote:active .ve{transform:scale(1.3)}
.vote .vl{font-size:27px;font-weight:800}
.vote .vc{font-size:32px;font-weight:900;color:var(--p)}
.ticket{padding:26px 32px;background:linear-gradient(160deg,#fff,#FFF6EC);border:3px dashed #F6C977}
.ticket h3{margin:0 0 14px;font-size:34px;color:#B45309}
.ticket div{font-size:28px;font-weight:700;padding:12px 0;border-bottom:2px dashed #F3DDB3}
.ticket div:last-child{border:none}
.ticket div b{font-size:38px;color:#D97706}

/* --- الختام --- */
.closing{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px}
.closing .trophy{font-size:150px;animation:floaty 3s ease-in-out infinite}
.closing h1{font-size:90px;margin:0;font-weight:900;color:var(--pd)}
.closing p{font-size:36px;font-weight:700;margin:0;max-width:1150px;line-height:1.7}
</style>
</head>
<body>
<div id="stage">
  <div id="progress"></div>
  <div id="hint">Space = التالي &nbsp;|&nbsp; ← → للتنقل &nbsp;|&nbsp; ت = تصفيق &nbsp;|&nbsp; F = ملء الشاشة</div>
  <div id="slides"></div>
  <div id="fx"></div>
  <!-- شريط التحكم -->
  <div id="bar">
    <button id="nextBtn" title="التالي (→ أو Space)">→</button>
    <span class="count" id="count">١ / ١</span>
    <button id="prevBtn" title="السابق (←)">←</button>
    <span class="sep"></span>
    <button class="clap" id="clapBtn" title="تصفيق (ت)">👏</button>
    <button id="fsBtn" title="ملء الشاشة (F)">⛶</button>
  </div>
</div>

<script>

/* ---------- أدوات مساعدة ---------- */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const toAr = n => String(n).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
const LETTERS = ["أ","ب","ج","د","هـ","و"];
const shuffle = a => { const b=[...a]; for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];} return b; };
const head = d => `<div class="shead rv" style="--i:0">${d.tag?`<span class="tag">${d.tag}</span>`:""}${d.title?`<h2 class="stitle">${d.title}</h2>`:""}</div>`;
let SCALE = 1;

/* ==========================================================================
   🔊 الأصوات — مولّدة بالكامل عبر Web Audio API (بدون ملفات خارجية)
   ========================================================================== */
const Sound = {
  ctx:null, master:null, noise:null,
  init(){
    if(!this.ctx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.gain.value = .9;
      this.master.connect(this.ctx.destination);
      // ضوضاء بيضاء تُستخدم لصوت التصفيق
      const len = this.ctx.sampleRate * 1;
      this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.noise.getChannelData(0);
      for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
    }
    if(this.ctx.state === "suspended") this.ctx.resume();
    return this.ctx;
  },
  // صفقة واحدة = ٢-٣ نبضات ضوضاء سريعة متتالية
  clapHit(t, vol){
    const c = this.ctx;
    const pulses = 2 + Math.floor(Math.random()*2);
    for(let p=0;p<pulses;p++){
      const tt = t + p*0.009;
      const src = c.createBufferSource(); src.buffer = this.noise;
      const bp = c.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value = 900 + Math.random()*1600; bp.Q.value = .9;
      const hp = c.createBiquadFilter(); hp.type="highpass"; hp.frequency.value = 500;
      const g = c.createGain();
      const v = p===pulses-1 ? vol : vol*.6;
      g.gain.setValueAtTime(0.0001, tt);
      g.gain.exponentialRampToValueAtTime(v, tt+0.002);
      g.gain.exponentialRampToValueAtTime(0.0001, tt + (p===pulses-1 ? 0.13 : 0.03));
      src.connect(bp).connect(hp).connect(g).connect(this.master);
      src.start(tt, Math.random()*0.8); src.stop(tt+0.2);
    }
  },
  // تصفيق جماعي قصير (≈ ١.٨ ثانية)
  applause(){
    if(!this.init()) return;
    const now = this.ctx.currentTime + 0.02, dur = 1.8, n = 60;
    for(let i=0;i<n;i++){
      const r = Math.random();
      const t = now + r*dur;
      const fade = r < .75 ? 1 : (1 - (r-.75)/.25);   // يخفت في النهاية
      this.clapHit(t, (0.25 + Math.random()*0.35) * fade);
    }
  },
  tone(freq, t, dur, type="sine", vol=.25){
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g).connect(this.master); o.start(t); o.stop(t+dur+0.05);
  },
  success(){ if(!this.init()) return; const t=this.ctx.currentTime;
    [523.25,659.25,783.99,1046.5].forEach((f,i)=>{ this.tone(f,t+i*0.09,.45,"triangle",.22); this.tone(f*2,t+i*0.09,.3,"sine",.05); }); },
  wrong(){ if(!this.init()) return; const t=this.ctx.currentTime;
    this.tone(392,t,.22,"sine",.18); this.tone(311,t+.16,.35,"sine",.16); },
  pop(){ if(!this.init()) return; const t=this.ctx.currentTime;
    this.tone(660,t,.12,"sine",.15); this.tone(990,t+.05,.14,"sine",.1); },
  tick(){ if(!this.init()) return; this.tone(1200,this.ctx.currentTime,.07,"square",.05); },
  bell(){ if(!this.init()) return; const t=this.ctx.currentTime;
    [0,.35,.7].forEach(d=>{ this.tone(880,t+d,1.1,"sine",.25); this.tone(1320,t+d,.8,"sine",.08); }); }
};

   ========================================================================== */
const FX = {
  el: null,
  claps(){
    for(let i=0;i<16;i++){
      const s = document.createElement("span");
      s.className = "clapfx"; s.textContent = "👏";
      s.style.left = (600 + Math.random()*400) + "px";
      s.style.top  = (720 + Math.random()*60) + "px";
      s.style.setProperty("--dx", (Math.random()*500-250) + "px");
      s.style.setProperty("--r", (Math.random()*60-30) + "deg");
      s.style.animationDelay = (Math.random()*0.5) + "s";
      s.style.fontSize = (34 + Math.random()*26) + "px";
      this.el.appendChild(s); setTimeout(()=>s.remove(), 2500);
    }
  },
  confetti(x=800, y=420, n=70){
    const colors = ["#6C3FD1","#8B5CF6","#14B8A6","#F59E0B","#EC4899","#C4B5FD"];
    for(let i=0;i<n;i++){
      const p = document.createElement("i");
      p.className = "conf";
      p.style.left = x+"px"; p.style.top = y+"px";
      p.style.background = colors[i%colors.length];
      const a = Math.random()*Math.PI*2, d = 180 + Math.random()*320;
      p.style.setProperty("--x", Math.cos(a)*d + "px");
      p.style.setProperty("--y", (Math.sin(a)*d + 160) + "px");
      p.style.setProperty("--r", (Math.random()*720-360) + "deg");
      p.style.width = (8+Math.random()*10)+"px";
      this.el.appendChild(p); setTimeout(()=>p.remove(), 1400);
    }
  },
  // تحويل موقع عنصر في الشاشة إلى إحداثيات المسرح
  at(el){
    const s = $("#stage").getBoundingClientRect(), r = el.getBoundingClientRect();
    return [(r.left + r.width/2 - s.left)/SCALE, (r.top + r.height/2 - s.top)/SCALE];
  },
  message(txt){
    const m = document.createElement("div"); m.className="bigmsg"; m.innerHTML = txt;
    this.el.appendChild(m); setTimeout(()=>m.remove(), 1700);
  }
};
function celebrate(el){ const [x,y] = el ? FX.at(el) : [800,420]; FX.confetti(x,y); Sound.success(); }
function clap(){ Sound.applause(); FX.claps(); const b=$("#clapBtn"); b.animate([{transform:"scale(1)"},{transform:"scale(1.3)"},{transform:"scale(1)"}],{duration:400}); }

/* ==========================================================================
   ⏱️ المؤقت (يُستخدم في التحديات والنقاش والمجموعات)
   ========================================================================== */
class Timer{
  constructor(host, sec, ring=false){
    this.host = host; this.total = sec; this.left = sec; this.ring = ring; this.iv = null;
    const C = 2*Math.PI*130; this.C = C;
    host.innerHTML = `
      <div class="timer ${ring?"ring":""}">
        ${ring ? `<div class="ringbox"><svg width="300" height="300"><circle class="bg" cx="150" cy="150" r="130" fill="none" stroke-width="22"/>
          <circle class="fg" cx="150" cy="150" r="130" fill="none" stroke-width="22" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="0"/></svg>
          <div class="tm-num"></div></div>` : `<div class="tm-num"></div>`}
        <div class="row c"><button class="btn sm tm-go">▶ ابدئي</button><button class="btn sm ghost tm-re">↺</button></div>
      </div>`;
    this.box = $(".timer", host);
    $(".tm-go", host).onclick = () => this.iv ? this.pause() : this.start();
    $(".tm-re", host).onclick = () => this.set(this.total);
    this.draw();
  }
  set(sec){ this.pause(); this.total = this.left = sec; this.box.classList.remove("done","warn"); this.draw(); }
  start(){ if(this.left<=0) this.set(this.total); this.box.classList.remove("done");
    this.iv = setInterval(()=>this.tick(), 1000); $(".tm-go",this.host).textContent = "⏸ إيقاف"; }
  pause(){ clearInterval(this.iv); this.iv = null; $(".tm-go",this.host).textContent = "▶ ابدئي"; }
  tick(){
    this.left--;
    if(this.left <= 10) this.box.classList.add("warn");
    if(this.left > 0 && this.left <= 5) Sound.tick();
    if(this.left <= 0){ this.left = 0; this.pause(); this.box.classList.add("done"); Sound.bell(); }
    this.draw();
  }
  draw(){
    const m = Math.floor(this.left/60), s = this.left%60;
    $(".tm-num", this.host).textContent = toAr(`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`);
    if(this.ring) $("circle.fg", this.host).style.strokeDashoffset = this.C * (1 - this.left/this.total);
  }
}

  /* ---------- لعبة الترتيب ---------- */
  order:{
    html:d => `${head(d)}
      <div class="body">
        <div class="row rv" style="--i:1"><p class="lead" style="flex:1">${d.question}</p><button class="btn sm ghost resetO">↺ إعادة</button></div>
        <div class="slots rv" style="--i:2">${d.steps.map((s,i)=>`${i?'<span class="arrow">←</span>':""}<div class="slot"><span class="sn">${toAr(i+1)}</span><span class="sl"></span><span class="sd"></span></div>`).join("")}</div>
        <div class="feedback ofb"></div>
        <div class="pool rv" style="--i:3"></div>
      </div>`,
    init:(el,d) => {
      const pool = $(".pool",el), slots = $$(".slot",el), fb = $(".ofb",el);
      let next = 0;
      const build = () => {
        next = 0; fb.innerHTML = "";
        slots.forEach(s=>{ s.classList.remove("fill"); $(".sl",s).textContent=""; $(".sd",s).textContent=""; });
        let order = shuffle(d.steps.map((_,i)=>i));
        while(order.every((v,i)=>v===i) && d.steps.length>1) order = shuffle(order);
        pool.innerHTML = order.map(i=>`<button data-i="${i}">${d.steps[i].icon} ${d.steps[i].label}</button>`).join("");
        $$("button",pool).forEach(b => b.onclick = () => {
          const i = +b.dataset.i;
          if(i === next){
            const s = slots[next]; s.classList.add("fill");
            $(".sl",s).textContent = d.steps[i].icon + " " + d.steps[i].label;
            $(".sd",s).textContent = d.steps[i].desc || "";
            b.classList.add("used"); next++; Sound.pop(); fb.innerHTML = "";
            if(next === d.steps.length){ fb.innerHTML = `<span class="ok">أحسنتِ! 👏 ترتيب صحيح</span>`; celebrate(fb); }
          } else {
            b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake"); Sound.wrong();
            fb.innerHTML = `<span class="no">حاولي مرة أخرى 💜 ما المرحلة رقم ${toAr(next+1)}؟</span>`;
          }
        });
      };
      $(".resetO",el).onclick = build; build();
    }
  },

  brainstorm:{
    html:d => `${head(d)}
      <div class="body">
        <div class="storm rv" style="--i:1"><div class="storm-center">${d.center}</div></div>
        <div class="storm-in rv" style="--i:2">
          <input type="text" placeholder="${d.placeholder}" maxlength="34">
          <button class="btn addI">➕ أضيفي</button>
          <button class="btn teal seedI">${d.seedBtn}</button>
          <button class="btn sm ghost clrI">↺</button>
        </div>
      </div>`,
    init:(el,d) => {
      const area = $(".storm",el), inp = $("input",el);
      let n = 0, seedK = 0;
      // أماكن الأفكار: عمودان على الجانبين + أعلى وأسفل الفكرة المركزية
      const SLOTS = [[84,12],[16,12],[84,31],[16,31],[84,50],[16,50],[84,69],[16,69],[84,88],[16,88],[50,9],[50,91]];
      const place = () => {
        const W = area.clientWidth || 1420, H = area.clientHeight || 520;
        const [px,py] = SLOTS[n % SLOTS.length], ring = Math.floor(n / SLOTS.length);
        n++;
        return [W*px/100 + (px<50? ring*30 : -ring*30), H*py/100 + ring*14];
      };
      const add = (txt, book=false) => {
        if(!txt.trim()) return;
        const [x,y] = place();
        const s = document.createElement("div");
        s.className = "idea" + (book?" book":""); s.textContent = txt;
        s.style.left = x+"px"; s.style.top = y+"px";
        area.appendChild(s); Sound.pop();
      };
      $(".addI",el).onclick = () => { add(inp.value); inp.value=""; inp.focus(); };
      inp.addEventListener("keydown", e => { if(e.key==="Enter"){ add(inp.value); inp.value=""; } e.stopPropagation(); });
      $(".seedI",el).onclick = () => { if(seedK < d.seeds.length) add(d.seeds[seedK++], true); if(seedK===d.seeds.length) $(".seedI",el).disabled=true; };
      $(".clrI",el).onclick = () => { $$(".idea",area).forEach(x=>x.remove()); n=0; seedK=0; $(".seedI",el).disabled=false; };
    }
  },

          <p class="lead muted" style="margin:0 0 6px;font-size:24px">اضغطي على الوجه عدد الطالبات الرافعات أيديهن ✋</p>

      $(".rsV",el).onclick = () => { counts.fill(0); draw(); };
    }
  },

  /* ---------- الختام ---------- */
  closing:{
    html:d => `
      <div class="closing">
        <div class="trophy rv" style="--i:0">${d.emoji}</div>
        <h1 class="rv" style="--i:1">${d.title}</h1>
        <p class="rv" style="--i:2">${d.message}</p>
        <div class="note rv" style="--i:3">${d.homework}</div>
        <button class="btn rv clapBig" style="--i:4;font-size:30px;background:linear-gradient(135deg,var(--am),#F97316);box-shadow:0 7px 0 #B45309">${d.clapHint}</button>
      </div>`,
    init:(el) => { $(".clapBig",el).onclick = () => { clap(); FX.confetti(800,300,90); }; }
  }
};

/* ==========================================================================
   🧭 نظام التنقل بين الشرائح
   ========================================================================== */
const holder = $("#slides");
const slidesEls = SLIDES.map((d, i) => {
  const s = document.createElement("section");
  s.className = "slide"; s.dataset.anim = d.anim || "fade"; s.dataset.dir = "next";
  const T = TYPES[d.type];
  s.innerHTML = T ? T.html(d) : `<h2>نوع غير معروف: ${d.type}</h2>`;
  holder.appendChild(s);
  if(T && T.init) T.init(s, d);
  return s;
});
const N = slidesEls.length;
let cur = -1;

function go(i){
  if(i < 0 || i >= N || i === cur) return;
  const dir = i > cur ? "next" : "prev";
  if(cur >= 0){
    const old = slidesEls[cur];
    old.classList.remove("active"); old.classList.add("leaving");
    setTimeout(()=>old.classList.remove("leaving"), 460);
  }
  const s = slidesEls[i];
  s.dataset.dir = dir;
  s.classList.remove("leaving");
  void s.offsetWidth;                 // إعادة تشغيل الحركات
  s.classList.add("active");
  cur = i;
  $("#count").textContent = `${toAr(cur+1)} / ${toAr(N)}`;
  $("#progress").style.width = ((cur+1)/N*100) + "%";
  try{ history.replaceState(null, "", "#" + (cur+1)); }catch(e){}
}
const next = () => go(cur + 1);
const prev = () => go(cur - 1);

/* أزرار الشريط */
$("#nextBtn").onclick = next;
$("#prevBtn").onclick = prev;
$("#clapBtn").onclick = clap;
$("#fsBtn").onclick = toggleFS;
function toggleFS(){
  if(!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(()=>{});
  else document.exitFullscreen?.();
}

/* لوحة المفاتيح */
document.addEventListener("keydown", e => {
  const tgt = e.target;
  if(tgt && (tgt.tagName === "INPUT" || tgt.tagName === "TEXTAREA")){
    if(e.key === "Escape") tgt.blur();
    return;                                 // لا نتدخل أثناء الكتابة
  }
  Sound.init();
  switch(true){
    case e.key === "ArrowRight" || e.key === " " || e.code === "Space" || e.key === "PageDown":
      e.preventDefault(); next(); break;
    case e.key === "ArrowLeft" || e.key === "PageUp":
      e.preventDefault(); prev(); break;
    case e.key === "Home": e.preventDefault(); go(0); break;
    case e.key === "End":  e.preventDefault(); go(N-1); break;
    case e.key === "ت" || e.code === "KeyJ":      // حرف ت (نفس زر J في لوحة المفاتيح)
      e.preventDefault(); clap(); break;
    case e.key === "f" || e.key === "F" || e.key === "ب":
      e.preventDefault(); toggleFS(); break;
    case e.key === "ArrowUp" || e.key === "ArrowDown":
      e.preventDefault(); break;
  }
  showBar();
});

/* إلغاء التركيز عن الأزرار بعد الضغط حتى لا يضغطها Space مرة أخرى */
document.addEventListener("click", e => { Sound.init(); const b = e.target.closest("button"); if(b) b.blur(); });
/* منع أي تمرير بعجلة الفأرة أو اللمس */
window.addEventListener("wheel", e => e.preventDefault(), {passive:false});
document.addEventListener("touchmove", e => { if(!e.target.closest("input")) e.preventDefault(); }, {passive:false});

/* إخفاء شريط التحكم تلقائيًا عند عدم تحريك الماوس */
let idleT;
function showBar(){
  document.body.classList.remove("idle");
  clearTimeout(idleT);
  idleT = setTimeout(()=>{ if(!$("#bar").matches(":hover")) document.body.classList.add("idle"); }, 1800);
}
["mousemove","pointerdown","touchstart"].forEach(ev => document.addEventListener(ev, showBar, {passive:true}));

/* ملاءمة المسرح (16:9) لحجم الشاشة دون تمرير */
function fit(){
  SCALE = Math.min(window.innerWidth/1600, window.innerHeight/900);
  $("#stage").style.transform = `translate(-50%,-50%) scale(${SCALE})`;
}
window.addEventListener("resize", fit);
/* إعادة أي إزاحة داخلية للصفر (مثلاً عند التركيز على حقل كتابة) */
document.addEventListener("scroll", e => { const t = e.target; if(t && t.scrollTop !== undefined){ t.scrollTop = 0; t.scrollLeft = 0; } }, true);

/* التشغيل */
FX.el = $("#fx");
fit();
const start = parseInt((location.hash||"").slice(1)) || 1;
go(Math.min(Math.max(start,1),N) - 1);
showBar();
</script>
