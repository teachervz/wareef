        <label>الدور الافتراضي</label><select name="role"><option value="">undefined غير محدد</option>${p.roles.map(x=>`<option ${r&&r.role===x?"selected":""}>${gpEsc(x)}</option>`).join("")}</select></div>
        <p class="gp-mini" style="margin-top:14px">💡 لإضافة أدوار جديدة: المشروع ← خصائص ← أدوار الموارد</p>`},
      {label:"📋 Assignments المهام المسندة", html: asg.length ? `<table class="gp-tbl"><tr><th>ID</th><th>Task name</th><th>Unit</th></tr>${asg.map(t=>`<tr><td>${toAr(t.id)}</td><td>${gpEsc(t.name)}</td><td>١٠٠</td></tr>`).join("")}</table>` : `<p class="gp-mini" style="font-size:16px">لم تُسند أي مهمة لهذا المورد بعد.</p>`}],
      ok:ov => {
        const F = n => $(`[name=${n}]`, ov), name = F("name").value.trim();
        if(!name){ F("name").focus(); F("name").style.borderColor = "#e53935"; return false; }
        this.snap(); const oldRole = r ? r.role : "";
        const o = r || {id:p.rid++}; o.name = name; o.phone = F("phone").value; o.email = F("email").value; o.role = F("role").value;
        if(!r) p.resources.push(o);
        this.tab = "res"; this.rsel = o.id; this.render();
        if(!r){ this.emit("resource"); this.toast("👤 تمت إضافة " + name); }
        if(o.role && o.role !== oldRole){ this.emit("roleAssign"); if(o.role === "مدير المشروع") this.emit("pm"); }
      }});
  }

  /* ---------- التصدير ---------- */
  exportDlg(){
    this.dialog({title:"Export wizard — معالج التصدير", w:760, tabs:[{label:"", html:`<div class="gp-yel">Step 1 (of 2) حدّدي المُصدِّر</div>
      <div class="gp-rad">
        <label class="dis"><input type="radio" name="ex" value="mpx" disabled> ملف Microsoft Project (MPX) <span class="gp-mini">— غير متاح في المحاكاة</span></label>
        <label class="dis"><input type="radio" name="ex" value="html" disabled> HTML report تقرير</label>
        <label><input type="radio" name="ex" value="pdf" checked> 📄 PDF تقرير</label>
        <label><input type="radio" name="ex" value="png"> 🖼️ Raster image file صورة PNG</label>
        <label><input type="radio" name="ex" value="csv"> 📊 Spreadsheet جدول بيانات (CSV)</label>
        <label><input type="radio" name="ex" value="json"> 💾 ملف المشروع (JSON)</label>
      </div>
      <div class="gp-f" style="margin-top:14px"><label>اسم الملف</label><input type="text" name="fn" value="${gpEsc(this.p.name || "untitled")}"></div>`}],
      ok:ov => { this.doExport($("[name=ex]:checked", ov).value, $("[name=fn]", ov).value.trim() || "untitled"); }});
    $(".ok", this.dlg).textContent = "موافق";
  }
  doExport(kind, fn){
    fn = fn || this.p.name || "untitled";
    if(kind === "json"){ gpDownload(JSON.stringify({app:"GanttProject-Sim", version:1, project:this.p}, null, 1), fn + ".gan.json", "application/json"); }
    else if(kind === "csv"){
      const L = [["ID","الاسم Name","تاريخ البدء Begin","تاريخ الانتهاء End","المدة Duration","التقدم %","الأولوية","مَعلَم","الموارد","المهام السابقة"]];
      this.p.tasks.forEach(t => { const [s,e] = this.span(t); L.push([t.id, "  ".repeat(this.depth(t)) + t.name, gpIso(s), gpIso(e), this.isPar(t) ? this.wdays(s,e) : t.dur, t.prog, (GP_PRI.find(x=>x[0]===t.pri)||[])[1], t.ms ? "نعم" : "", t.res.map(x=>this.resName(x.rid)).join(" - "), t.deps.map(d=>d.id + d.type).join(" ")]); });
      gpDownload("﻿" + L.map(r => r.map(c => `"${String(c ?? "").replace(/"/g,'""')}"`).join(",")).join("\r\n"), fn + ".csv", "text/csv;charset=utf-8");
    }
    else {
      const url = this.png();
      if(kind === "png") gpDownload(url, fn + ".png");
      else {
        const w = window.open("", "_blank");
        if(!w){ gpDownload(url, fn + ".png"); this.toast("⚠️ تعذّر فتح نافذة الطباعة — تم تنزيل صورة بدلًا منها"); this.emit("export"); return; }
        w.document.write(`<!doctype html><html dir="rtl"><head><meta charset="utf-8"><title>${gpEsc(fn)}</title><style>@page{size:A4 landscape;margin:10mm}body{margin:0;font-family:Tahoma}img{width:100%}p{color:#777;font-size:12px}</style></head><body><img src="${url}"><p>اختاري «حفظ بصيغة PDF» من نافذة الطباعة</p><script>setTimeout(function(){print()},500)<\/script></body></html>`);
        w.document.close();
      }
    }
    this.toast(kind === "pdf" ? "🖨️ اختاري «حفظ بصيغة PDF» من نافذة الطباعة" : "📤 تم التصدير بنجاح — راجعي مجلد التنزيلات"); this.emit("export");
  }
  png(){
    const tasks = this.p.tasks; let [a,b] = this.range(); if(tasks.length){ const sp = tasks.map(t => this.span(t)); a = Math.min(...sp.map(x=>x[0])) - 2; b = Math.max(...sp.map(x=>x[1])) + 4; }
    const dw = 22, rh = 30, tw = 460, top = 70, hh = 50;
    const W = tw + (b-a+1)*dw, H = top + hh + tasks.length*rh + 30, k = 2;
    const c = document.createElement("canvas"); c.width = W*k; c.height = H*k; const g = c.getContext("2d"); g.scale(k,k);
    const F = (s,w=400) => `${w} ${s}px Cairo, Tahoma, sans-serif`;
    g.fillStyle = "#fff"; g.fillRect(0,0,W,H);
    g.direction = "rtl"; g.textAlign = "right"; g.fillStyle = "#2a1b4d"; g.font = F(22,800); g.fillText(`${this.p.name || "مشروع"}${this.p.org ? " — " + this.p.org : ""}`, W-16, 36);
    g.font = F(13); g.fillStyle = "#777"; g.fillText(`GanttProject • ${gpFmt(this.p.start)}`, W-16, 58);
    const cw = W - tw; // عرض منطقة المخطط (يسار)
    // رأس الجدول
    g.fillStyle = "#e6e6e6"; g.fillRect(cw, top, tw, hh); g.fillStyle = "#f4f4f4"; g.fillRect(0, top, cw, hh);
    g.fillStyle = "#222"; g.font = F(14,800); g.textAlign = "center";
    g.fillText("الاسم Name", cw + tw - 130, top + 32); g.fillText("البدء", cw + 140, top + 32); g.fillText("الانتهاء", cw + 50, top + 32);
    g.direction = "ltr"; let lastM = -1;
    for(let n=a; n<=b; n++){ const d = gpD(n), x = (n-a)*dw;
      if(!this.isW(n)){ g.fillStyle = "#efefef"; g.fillRect(x, top + hh, dw, tasks.length*rh); }
      g.fillStyle = "#444"; g.font = F(10); g.textAlign = "center"; g.fillText(String(d.getUTCDate()), x + dw/2, top + 42);
      if(d.getUTCMonth() !== lastM){ lastM = d.getUTCMonth(); g.textAlign = "left"; g.font = F(12,800); g.fillText(`${GP_MONTHS[lastM]} ${d.getUTCFullYear()}`, x + 3, top + 18); }
    }
    const pos = {}; tasks.forEach((t,i) => pos[t.id] = i);
    tasks.forEach((t,i) => { const y = top + hh + i*rh, [s,e] = this.span(t), par = this.isPar(t);
      g.strokeStyle = "#e5e5e5"; g.beginPath(); g.moveTo(0, y+rh); g.lineTo(W, y+rh); g.stroke();
      g.direction = "rtl"; g.textAlign = "right"; g.fillStyle = "#222"; g.font = F(13, par ? 800 : 400);
      g.fillText((t.ms ? "◆ " : "") + t.name, W - 10 - this.depth(t)*18, y + 20);
      g.textAlign = "center"; g.font = F(12); g.fillText(gpFmt(s), cw + 140, y + 20); g.fillText(gpFmt(e), cw + 50, y + 20);
      const x = (s-a)*dw, w = (e-s+1)*dw - 2;
      if(par){ g.fillStyle = "#6f97c4"; g.fillRect(x, y+11, w, 6); }
      else if(t.ms){ g.save(); g.translate(x + dw/2, y + 15); g.rotate(Math.PI/4); g.fillStyle = "#5aa7d4"; g.fillRect(-6,-6,12,12); g.restore(); }
      else { g.fillStyle = t.color || "#8fb0d3"; g.fillRect(x+1, y+7, w, 16); g.strokeStyle = "#5c80aa"; g.strokeRect(x+1, y+7, w, 16);
        if(t.prog){ g.fillStyle = "#1d1d1d"; g.fillRect(x+1, y+13, w*t.prog/100, 5); } }
    });
    g.strokeStyle = "#222"; g.lineWidth = 1.3;
    tasks.forEach(t => t.deps.forEach(d => { const pr = this.byId(d.id); if(!pr || pos[pr.id] == null) return;
      const [,pe] = this.span(pr), [s] = this.span(t), x1 = (pe-a+1)*dw, y1 = top + hh + pos[pr.id]*rh + 15, x2 = (s-a)*dw, y2 = top + hh + pos[t.id]*rh + 15;
      g.beginPath(); g.moveTo(x1,y1); g.lineTo(x1+6,y1); g.lineTo(x1+6,y2); g.lineTo(x2,y2); g.stroke(); }));
    g.strokeStyle = "#999"; g.beginPath(); g.moveTo(cw, top); g.lineTo(cw, H-30); g.stroke();
    return c.toDataURL("image/png");
  }

  /* ---------- المهام التعليمية والجولة والتنبيهات ---------- */
  emit(ev){
    const m = this.missions.find(x => x.ev === ev); if(!m || this.done.has(ev)) return;
    this.done.add(ev); this.drawMissions(); this.toast("✅ أنجزتِ: " + m.text.split("(")[0]); Sound.success();
    if(this.done.size === this.missions.length){ setTimeout(() => { FX.confetti(800,400,110); FX.message("أحسنتِ! 👏 أنجزتِ كل المهام"); Sound.applause(); }, 500); }
  }
  drawMissions(){
    if(!this.missions.length) return;
    const n = this.done.size, N = this.missions.length, mc = this.$(".gp-mc"); if(mc) mc.textContent = `${toAr(n)}/${toAr(N)}`;
    this.$(".gp-mbtn").classList.toggle("pulse", !this.misOpen && n < N);
    let box = $(".gp-mis", this.layer);
    if(!this.misOpen){ if(box) box.remove(); return; }
    if(!box){ box = document.createElement("div"); box.className = "gp-mis"; this.layer.appendChild(box); }
    box.innerHTML = `<h4>🎯 مهامي في جانت بروجكت <span style="color:#888;font-size:15px">${toAr(n)} / ${toAr(N)}</span><button data-a="missions" title="إخفاء">✕</button></h4>
      <ol>${this.missions.map((m,i) => `<li class="${this.done.has(m.ev)?"ok":""}"><span class="ck">✓</span><span>${toAr(i+1)}. ${m.text}</span></li>`).join("")}</ol>
      <div class="bar"><i style="width:${n/N*100}%"></i></div>`;
  }
  toast(msg){ $$(".gp-toast", this.layer).forEach(x => x.remove()); const t = document.createElement("div"); t.className = "gp-toast"; t.textContent = msg; this.layer.appendChild(t); setTimeout(() => t.remove(), 2700); }
  placeTour(){
    $$(".gp-tb-badge,.gp-tip", this.layer).forEach(x => x.remove());
    this.$("[data-a=tour]").classList.toggle("pulse", this.tourOn);
    if(!this.tourOn) return;
    const R = this.root.getBoundingClientRect(); if(!R.width) return;
    $$("[data-tour]", this.root).forEach((el,i) => {
      const r = el.getBoundingClientRect(); if(!r.width) return;
      const b = document.createElement("div"); b.className = "gp-tb-badge"; b.textContent = toAr(i+1);
      const L = Math.max(r.left, R.left), Rt = Math.min(r.right, R.right), tp = el.dataset.tp;
      let x = (Rt - R.left)/SCALE - 20, y = Math.max(2, (r.top - R.top)/SCALE - 12);
      if(tp === "c"){ x = ((L + Rt)/2 - R.left)/SCALE - 16; y = ((r.top + Math.min(r.bottom, R.bottom))/2 - R.top)/SCALE - 16; }
      if(tp === "l"){ x = (L - R.left)/SCALE + 60; }
      x = Math.min(x, R.width/SCALE - 40);
      b.style.left = x + "px"; b.style.top = y + "px"; b.style.animationDelay = (i*60) + "ms";
      b.onclick = ev => { ev.stopPropagation(); const was = b.classList.contains("on"); this.closeFloat(); if(was) return;
        b.classList.add("on"); Sound.pop();
        const tip = document.createElement("div"); tip.className = "gp-tip"; tip.innerHTML = `<b style="color:#1f7ae0">${toAr(i+1)}</b> — ${el.dataset.tour}`;
        this.layer.appendChild(tip);
        const W = this.root.offsetWidth, H = this.root.offsetHeight;
        tip.style.left = Math.max(6, Math.min(x - 300, W - tip.offsetWidth - 6)) + "px";
        tip.style.top = Math.min(y + 40, H - tip.offsetHeight - 6) + "px"; };
      this.layer.appendChild(b);
    });
  }

  /* ---------- لوحة المفاتيح ---------- */
  key(e){
    const t = e.target, typing = t && /INPUT|TEXTAREA|SELECT/.test(t.tagName);
    if(this.dlg){
      if(e.key === "Escape"){ e.preventDefault(); this.closeDlg(); return true; }
      if(e.key === "Enter" && !(t && (t.tagName === "TEXTAREA" || t.dataset.enter))){ e.preventDefault(); $(".ok", this.dlg).click(); return true; }
      return true;
    }
    if(e.key === "Escape" && ($(".gp-cm", this.layer) || $(".gp-tip", this.layer))){ this.closeFloat(); return true; }
    if(typing) return false;
    const c = e.ctrlKey || e.metaKey;
    if(c){ const map = {KeyT:"newTask", KeyZ:"undo", KeyY:"redo", KeyC:"copy", KeyX:"cut", KeyV:"paste", KeyS:"save", KeyO:"open", KeyF:"find", KeyP:"print"};
      const a = map[e.code]; if(a){ e.preventDefault(); this.act(a); return true; } return false; }
    if(e.key === "Delete" || e.key === "Backspace"){ e.preventDefault(); this.act("delete"); return true; }
    if(e.key === "Insert"){ e.preventDefault(); this.act("newTask"); return true; }
    if(e.altKey && e.key === "Enter"){ e.preventDefault(); this.act("props"); return true; }
    return false;
  }
}


/* ==========================================================================
   🧭 نظام التنقل بين الشرائح
   ========================================================================== */
const holder = $("#slides");
const slidesEls = SLIDES.map((d, i) => {
  const s = document.createElement("section");
  s.className = "slide" + (d.type === "gantt" ? " gslide" : ""); s.dataset.anim = d.anim || "fade"; s.dataset.dir = "next";
  const T = TYPES[d.type];
  s.innerHTML = T ? T.html(d) : `<h2>نوع غير معروف: ${d.type}</h2>`;
  holder.appendChild(s);
  if(T && T.init) T.init(s, d);
  return s;
});
const N = slidesEls.length;
let cur = -1;

function go(i){
  if(i < 0 || i >= N || i === cur) return;
  const dir = i > cur ? "next" : "prev";
  if(cur >= 0){
    const old = slidesEls[cur];
    old.classList.remove("active"); old.classList.add("leaving");
    setTimeout(()=>old.classList.remove("leaving"), 460);
  }
  const s = slidesEls[i];
  s.dataset.dir = dir;
  s.classList.remove("leaving");
  void s.offsetWidth;                 // إعادة تشغيل الحركات
  s.classList.add("active");
  cur = i;
  $("#count").textContent = `${toAr(cur+1)} / ${toAr(N)}`;
  $("#progress").style.width = ((cur+1)/N*100) + "%";
  try{ history.replaceState(null, "", "#" + (cur+1)); }catch(e){}
}
const next = () => go(cur + 1);
const prev = () => go(cur - 1);

/* أزرار الشريط */
$("#nextBtn").onclick = next;
$("#prevBtn").onclick = prev;
$("#clapBtn").onclick = clap;
$("#fsBtn").onclick = toggleFS;
function toggleFS(){
  if(!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(()=>{});
  else document.exitFullscreen?.();
}

/* لوحة المفاتيح */
document.addEventListener("keydown", e => {
  const tgt = e.target;
  if(window.KEYHOOK && window.KEYHOOK(e)){ showBar(); return; }   // اختصارات محاكي جانت
  if(tgt && (tgt.tagName === "INPUT" || tgt.tagName === "TEXTAREA" || tgt.tagName === "SELECT")){
    if(e.key === "Escape") tgt.blur();
    return;                                 // لا نتدخل أثناء الكتابة
  }
  Sound.init();
  switch(true){
    case e.key === "ArrowRight" || e.key === " " || e.code === "Space" || e.key === "PageDown":
      e.preventDefault(); next(); break;
    case e.key === "ArrowLeft" || e.key === "PageUp":
      e.preventDefault(); prev(); break;
    case e.key === "Home": e.preventDefault(); go(0); break;
    case e.key === "End":  e.preventDefault(); go(N-1); break;
    case e.key === "ت" || e.code === "KeyJ":      // حرف ت (نفس زر J في لوحة المفاتيح)
      e.preventDefault(); clap(); break;
    case e.key === "f" || e.key === "F" || e.key === "ب":
      e.preventDefault(); toggleFS(); break;
    case e.key === "ArrowUp" || e.key === "ArrowDown":
      e.preventDefault(); break;
  }
  showBar();
});

/* إلغاء التركيز عن الأزرار بعد الضغط حتى لا يضغطها Space مرة أخرى */
document.addEventListener("click", e => { Sound.init(); const b = e.target.closest("button"); if(b) b.blur(); });
/* منع أي تمرير بعجلة الفأرة أو اللمس */
window.addEventListener("wheel", e => { if(!e.target.closest(".scrollable")) e.preventDefault(); }, {passive:false});
document.addEventListener("touchmove", e => { if(!e.target.closest("input,.scrollable")) e.preventDefault(); }, {passive:false});

/* إخفاء شريط التحكم تلقائيًا عند عدم تحريك الماوس */
let idleT;
function showBar(){
  document.body.classList.remove("idle");
  clearTimeout(idleT);
  idleT = setTimeout(()=>{ if(!$("#bar").matches(":hover")) document.body.classList.add("idle"); }, 1800);
}
["mousemove","pointerdown","touchstart"].forEach(ev => document.addEventListener(ev, showBar, {passive:true}));

/* ملاءمة المسرح (16:9) لحجم الشاشة دون تمرير */
function fit(){
  SCALE = Math.min(window.innerWidth/1600, window.innerHeight/900);
  $("#stage").style.transform = `translate(-50%,-50%) scale(${SCALE})`;
}
window.addEventListener("resize", fit);
/* إعادة أي إزاحة داخلية للصفر (مثلاً عند التركيز على حقل كتابة) */
document.addEventListener("scroll", e => { const t = e.target; if(t && t.nodeType === 1 && (t.id === "stage" || t.id === "slides" || t.classList.contains("slide"))){ t.scrollTop = 0; t.scrollLeft = 0; } }, true);

/* التشغيل */
FX.el = $("#fx");
fit();
const start = parseInt((location.hash||"").slice(1)) || 1;
go(Math.min(Math.max(start,1),N) - 1);
showBar();
</script>
